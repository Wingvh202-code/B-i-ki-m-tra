    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            font-weight: 600;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 24px;
            color: #555;
            flex-direction: column;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #ff7094;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.2s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .donate-container {
            margin-top: 15px;
            text-align: center;
            font-family: "Mali", cursive;
        }

        .donate-message {
            font-size: 14px;
            font-weight: 600;
            color: #ff4444;
            user-select: none;
            border: 1.5px dashed #ff4444;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #fffafa;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-donate {
            font-family: "Mali", cursive;
            background-color: #ff6565;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-donate:hover {
            background-color: #ff4444;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.2);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100000;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 30px 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .close-btn-dn {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #bbb;
            line-height: 1;
            transition: color 0.2s;
        }

        .close-btn-dn:hover {
            color: #333;
        }

        .modal-title {
            margin: 0 0 5px;
            color: #ff4444;
            font-size: 22px;
        }

        .qr-code-wrapper {
            background: #fdfdfd;
            padding: 15px;
            border-radius: 16px;
            margin: 15px 0;
            border: 1px solid #eee;
        }

        .qr-code-wrapper img {
            width: 100%;
            max-width: 220px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        .bank-info-box {
            background: #fff8f8;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ffebeb;
        }

        .bank-details {
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.6;
            color: #444;
        }

        .stk-copy-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        #stk-number {
            font-weight: 800;
            color: #222;
            font-size: 18px;
            letter-spacing: 0.5px;
            flex: 1;
            text-align: center;
        }

        .btn-copy-dn {
            background: #ff6565;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        body.modal-open {
            overflow: hidden;
        }

        #thumbs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
        }

        .thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #ffccd5;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .thumb:hover {
            transform: scale(1.1);
            border-color: var(--primary);
            box-shadow: 0 6px 12px rgba(255, 77, 109, 0.3);
        }

        .thumb-item {
            position: relative;
            display: inline-block;
        }

        .thumb-item .del {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>

        const MAX_PER_GROUP = ALPHABET.length * ALPHABET.length; 
        const WORD_TO_CODE = new Map();
        const CODE_TO_WORD = new Map();

        // Lưu trữ thông tin kiểm tra cho UI
        const DICTIONARY_ENTRIES = [];
        const SKIPPED_ENTRIES = [];
        let SHORT_VALID_COUNT = 0;
        let LOVE_VALID_COUNT = 0;
        let OTHER_VALID_COUNT = 0;

        (function buildDictionary() {
            const norm = w => w.normalize("NFC").toLowerCase().trim();
            const seen = new Set();

            function addGroup(list, prefix, label) {
                let index = 0;
                for (const raw of list) {
                    const word = norm(raw);
                    if (word.length < 4) {
                        SKIPPED_ENTRIES.push({ word: raw, group: label, reason: `Quá ngắn (${word.length} ký tự < 4)` });
                        continue;
                    }
                    if (seen.has(word)) {
                        SKIPPED_ENTRIES.push({ word: raw, group: label, reason: `Trùng lặp (đã đăng ký với mã ${WORD_TO_CODE.get(word)})` });
                        continue;
                    }

                    if (index >= MAX_PER_GROUP) {
                        SKIPPED_ENTRIES.push({ word: raw, group: label, reason: `Vượt giới hạn ${MAX_PER_GROUP} mã/nhóm` });
                        if (typeof console !== "undefined") {
                            console.warn("[Keypans] " + label + " vượt " + MAX_PER_GROUP + " mã, bỏ qua từ: " + word);
                        }
                        break;
                    }
                    const code = prefix + ALPHABET[Math.floor(index / 26)] + ALPHABET[index % 26];

                    seen.add(word);
                    index++;
                    WORD_TO_CODE.set(word, code);
                    CODE_TO_WORD.set(code, word);

                    const wordCount = word.split(/\s+/).filter(Boolean).length;
                    DICTIONARY_ENTRIES.push({
                        stt: DICTIONARY_ENTRIES.length + 1,
                        groupIndex: index,
                        word,
                        code,
                        prefix,
                        group: label,
                        wordCount,
                        savedChars: word.length - code.length
                    });
                }
                return index;
            }

            SHORT_VALID_COUNT = addGroup(SHORT_WORDS, "_", "SHORT_WORDS"); // Tiền tố _
            LOVE_VALID_COUNT  = addGroup(LOVE_WORDS,  "*", "LOVE_WORDS");  // Tiền tố *
            OTHER_VALID_COUNT = addGroup(OTHER_WORDS, "#", "OTHER_WORDS"); // Tiền tố #
        })();

        const capFirst = w => w.charAt(0).toUpperCase() + w.slice(1);
        const capEach = w => w.split(" ").map(capFirst).join(" ");

        function caseVariants(word) {
            return [
                ["ll", word],
                ["Ul", capFirst(word)],
                ["UU", word.toUpperCase()],
                ["lU", capEach(word)]
            ];
        }

        const WORD_CLASS = "[\\p{L}\\p{N}_]";

        const COMPRESS_REGEX = new RegExp(
            "(^|[^\\p{L}\\p{N}_])(" +
            [...WORD_TO_CODE.keys()]
                .sort((a, b) => b.length - a.length)
                .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
                .join("|") +
            ")(?!" + WORD_CLASS + ")",
            "giu"
        );

        function encodeMatch(match) {
            const key = match.toLowerCase();
            const code = WORD_TO_CODE.get(key);
            if (!code) return null;

            for (const [mask, form] of caseVariants(key)) {
                if (form === match) {
                    const c1 = mask[0] === "U" ? code[1].toUpperCase() : code[1];
                    const c2 = mask[1] === "U" ? code[2].toUpperCase() : code[2];
                    return code[0] + c1 + c2;
                }
            }
            return null;
        }

        /**
         * Nén văn bản (Escape *, _, #)
         */
        function compressWithDictionary(text) {
            if (!text) return "";
            return text
                .normalize("NFC")
                .replace(/[*_#]/g, c => c + c)
                .replace(COMPRESS_REGEX, (full, sep, match) => {
                    const encoded = encodeMatch(match);
                    return encoded === null ? full : sep + encoded;
                });

        /**
         * Giải nén văn bản (Hỗ trợ _, *, #)
         */
        function decompressWithDictionary(text) {
            if (!text) return "";
            return text.replace(/\*\*|__|##|(_|\*|#)[a-zA-Z]{2}/g, (token) => {
                if (token === "**") return "*";
                if (token === "__") return "_";
                if (token === "##") return "#";

                const prefix = token[0];
                const chars = token.slice(1);
                const word = CODE_TO_WORD.get(prefix + chars.toLowerCase());

                if (!word) return token;

                const c1Upper = chars[0] !== chars[0].toLowerCase();
                const c2Upper = chars[1] !== chars[1].toLowerCase();

                if (c1Upper && c2Upper) return word.toUpperCase();
                if (c1Upper) return capFirst(word);
                if (c2Upper) return capEach(word);
                return word;
            });
        }

        function verifyRoundTrip(text) {
            const expected = (text || "").normalize("NFC");
            return decompressWithDictionary(compressWithDictionary(text)) === expected;
        }
